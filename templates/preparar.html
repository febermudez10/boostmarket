<style>
.prepare-container{
    max-width:1180px;
    margin:0 auto;
}

.prepare-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:18px;
}

.prepare-card{
    background:#fff;
    border:1px solid #e4e7ec;
    border-radius:11px;
    padding:20px;
    margin-bottom:18px;
}

.prepare-card h2{
    margin:0 0 16px;
    font-size:18px;
}

.vehicle-title{
    font-size:24px;
    font-weight:800;
    margin-bottom:5px;
}

.vehicle-vin{
    color:#697586;
    font-size:13px;
    margin-bottom:18px;
}

.info-row{
    display:flex;
    justify-content:space-between;
    padding:10px 0;
    border-bottom:1px solid #edf0f3;
}

.info-row span{
    color:#697586;
}

.info-row strong{
    text-align:right;
}

.market-price{
    font-size:22px;
    font-weight:800;
}

.field{
    margin-bottom:15px;
}

.field label{
    display:block;
    font-size:12px;
    font-weight:700;
    margin-bottom:6px;
    color:#475467;
}

.field input,
.field textarea{
    width:100%;
    padding:11px;
    border:1px solid #d4d9e0;
    border-radius:7px;
    font-family:inherit;
    font-size:14px;
}

.field textarea{
    min-height:180px;
    resize:vertical;
}

.action-row{
    display:flex;
    gap:10px;
    margin-top:18px;
}

.secondary{
    background:#fff;
    color:#111827;
    border:1px solid #d4d9e0;
}

.status{
    padding:6px 10px;
    border-radius:99px;
    background:#fff4d7;
    color:#8a5b00;
    font-size:11px;
    font-weight:700;
}

.loading{
    padding:40px;
    text-align:center;
    color:#697586;
}


/* ==============================
   GALERÍA COMPACTA
============================== */

.gallery-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:12px;
}

.gallery-head h2{
    margin:0;
}

.photo-count{
    font-size:12px;
    font-weight:700;
    color:#475467;
    background:#f2f4f7;
    padding:6px 10px;
    border-radius:99px;
}


/* La galería completa ya no ocupa
   toda la pantalla */

.main-photo-wrap{
    width:48%;
    height:300px;
    background:#f2f4f7;
    border:1px solid #e4e7ec;
    border-radius:10px;
    overflow:hidden;
    display:inline-flex;
    vertical-align:top;
    align-items:center;
    justify-content:center;
}

.main-photo{
    width:100%;
    height:100%;
    object-fit:contain;
    display:block;
}

.no-photo{
    color:#697586;
    font-size:14px;
}


/* Miniaturas al lado de la foto principal */

.thumbnails{
    width:50%;
    height:300px;
    display:inline-grid;
    grid-template-columns:repeat(4,1fr);
    gap:7px;
    padding-left:10px;
    vertical-align:top;
    overflow-y:auto;
    box-sizing:border-box;
}

.thumb{
    width:100%;
    height:68px;
    object-fit:cover;
    border:2px solid transparent;
    border-radius:7px;
    cursor:pointer;
    background:#f2f4f7;
}

.thumb:hover{
    border-color:#98a2b3;
}

.thumb.active{
    border-color:#111827;
}


/* ==============================
   TELÉFONO
============================== */

@media(max-width:800px){

    .prepare-grid{
        grid-template-columns:1fr;
    }

    .main-photo-wrap{
        width:100%;
        height:260px;
        display:flex;
    }

    .thumbnails{
        width:100%;
        height:auto;
        max-height:200px;
        display:grid;
        grid-template-columns:repeat(4,1fr);
        padding-left:0;
        margin-top:8px;
    }

    .thumb{
        height:auto;
        aspect-ratio:4/3;
    }
}
</style>
